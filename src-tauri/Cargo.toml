[package]
name = "tresor"
version = "1.0.0"
description = "Tresor — a fully local, cross-platform password vault"
authors = ["Olivier Lüthy"]
edition = "2021"

[lib]
name = "tresor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
sha1 = "0.10"
base64 = "0.22"

# Data
uuid = { version = "1", features = ["v4"] }

# Analysis / utilities
zxcvbn = "3"
strsim = "0.11"
url = "2"
csv = "1"

# Networking (only used for the opt-in HIBP breach check)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# Errors / time
thiserror = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
